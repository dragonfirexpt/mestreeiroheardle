<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mestre eiro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>
<!-- Adicione antes do .game-card -->
<div id="auth-container" class="auth-box">
    <h2>Mestre Eiro Music</h2>
    <div id="login-form">
        <input type="text" id="loginUser" placeholder="Usuário">
        <input type="password" id="loginPass" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <p>Não tem conta? <a href="#" onclick="toggleAuth()">Registrar</a></p>
    </div>
    
    <div id="register-form" style="display:none;">
        <input type="text" id="regUser" placeholder="Novo Usuário">
        <input type="password" id="regPass" placeholder="Senha">
        <label>Foto de Perfil:</label>
        <input type="file" id="regAvatar" accept="image/*">
        <button onclick="register()">Criar Conta</button>
        <p>Já tem conta? <a href="#" onclick="toggleAuth()">Login</a></p>
    </div>
</div>

<!-- Dentro do .game-card (Esconda-o por padrão) -->
<div class="game-card" id="game-container" style="display: none;">
    <div class="user-profile">
        <img id="userAvatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    <!-- ... resto do seu jogo ... -->
</div>
    <div class="game-card">
        <header>
            <div class="score-badge">Ronda: <span id="roundCount">1</span></div>
            <i class="fas fa-compact-disc disc-icon"></i>
            <h1>Mestre eiro musicas</h1>
        </header>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="controls">
            <button id="playBtn" class="main-btn"><i class="fas fa-play"></i></button>
            <p id="timerDisplay">Tempo: <span>3s</span></p>
        </div>

        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="guessInput" placeholder="Nome da música..." autocomplete="off">
                <ul id="suggestionList" class="dropdown"></ul>
            </div>
            <button id="guessBtn">Enviar</button>
        </div>

        <div id="feedback"></div>
        <button id="nextBtn" class="next-btn" style="display: none;">Próxima Música <i class="fas fa-forward"></i></button>

        <div id="hintsSection" class="hints-container">
            <h3>Dicas Desbloqueadas</h3>
            <div id="hintsList"></div>
        </div>

        <div class="playlist-stats">
    <div class="stat-item">
        <i class="fas fa-check-circle"></i> <span id="countLancadas">0</span> Lançadas
    </div>
    <div class="stat-item">
        <i class="fas fa-times-circle"></i> <span id="countNaoLancadas">0</span> Não Lançadas
    </div>
</div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
